<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="diagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Dark Engineering Obsidian Slate Canvas -->
  <rect width="32" height="32" rx="5" fill="#0b0f19"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="4.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Left Pillar (Architectural Muted Slate) -->
